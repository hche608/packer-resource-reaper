AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  AWS Packer Resource Reaper (BYOR - Bring Your Own Role) - Serverless zombie resource cleanup.
  Identifies and cleans up EC2 instances and associated resources left behind by failed Packer builds.
  This variant requires a pre-created IAM role ARN - no IAM capabilities needed for deployment.
  WARNING: Instances are detected by SSH key name pattern "packer_*". Do NOT use if you have
  non-Packer instances using similar key naming patterns.

Metadata:
  AWS::ServerlessRepo::Application:
    Name: packer-resource-reaper-byor
    Description: >
      Clean up zombie EC2 instances and resources from failed Packer builds.
      Identifies resources by SSH key name pattern and age threshold.
      BYOR variant - supply your own IAM role. No CAPABILITY_IAM required.
    Author: DevOps Team
    SpdxLicenseId: MIT
    LicenseUrl: LICENSE
    ReadmeUrl: SAR-README-BYOR.md
    HomePageUrl: https://github.com/hche608/packer-resource-reaper
    SourceCodeUrl: https://github.com/hche608/packer-resource-reaper
    SemanticVersion: 2.0.0
    Labels:
      - packer
      - ec2
      - cleanup
      - serverless
      - lambda
      - cost-optimization
      - byor
      - enterprise

Parameters:
  LambdaRoleArn:
    Type: String
    Description: >
      ARN of a pre-created IAM role for the Lambda function.
      The role must have permissions for EC2 describe/terminate/delete,
      IAM list/delete, SNS publish, STS get-caller-identity, and CloudWatch Logs.
      See README for the required IAM policy.

  MaxInstanceAgeHours:
    Type: Number
    Default: 2
    Description: Maximum age in hours before an instance is considered for cleanup (must be positive)
    MinValue: 1
    MaxValue: 168

  DryRun:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
    Description: >
      Enable dry-run mode. When true, identifies cleanup candidates without executing
      destructive operations. Set to 'false' to enable actual cleanup.

  ScheduleExpression:
    Type: String
    Default: 'rate(1 hour)'
    Description: >
      EventBridge schedule expression for reaper execution.
      Examples: 'rate(1 hour)', 'rate(30 minutes)', 'cron(0 * * * ? *)'

  NotificationEmail:
    Type: String
    Default: ''
    Description: Email address for cleanup notifications (optional)

  LogLevel:
    Type: String
    Default: 'INFO'
    AllowedValues:
      - 'DEBUG'
      - 'INFO'
      - 'WARNING'
      - 'ERROR'
      - 'CRITICAL'
    Description: >
      Log level for the Lambda function. Use DEBUG for detailed troubleshooting,
      INFO for normal operation, ERROR or higher for production cost savings.

  BatchDeleteSize:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 50
    Description: >
      Number of resources to delete concurrently in each batch.
      Default is 1 (sequential deletion). Higher values improve performance
      but increase API call concurrency.

  KeyPairPattern:
    Type: String
    Default: 'packer_'
    Description: >
      Prefix pattern for identifying Packer-created key pairs.
      Only instances with key pairs matching this pattern will be considered for cleanup.

  LogRetentionDays:
    Type: Number
    Default: 30
    Description: Number of days to retain CloudWatch logs
    AllowedValues:
      - 1
      - 3
      - 5
      - 7
      - 14
      - 30
      - 60
      - 90
      - 120
      - 150
      - 180
      - 365
      - 400
      - 545
      - 731
      - 1827
      - 3653

Conditions:
  HasNotificationEmail: !Not [!Equals [!Ref NotificationEmail, '']]

Globals:
  Function:
    Timeout: 300
    MemorySize: 256
    Runtime: python3.14
    Architectures:
      - arm64

Resources:
  # SNS Topic for notifications
  NotificationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${AWS::StackName}-notifications'
      DisplayName: Packer Resource Reaper Notifications
      Tags:
        - Key: Application
          Value: PackerResourceReaper
        - Key: ManagedBy
          Value: SAM

  # Email subscription (if provided)
  EmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasNotificationEmail
    Properties:
      TopicArn: !Ref NotificationTopic
      Protocol: email
      Endpoint: !Ref NotificationEmail

  # Lambda function using the provided IAM role (BYOR)
  ReaperFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-function'
      Description: >
        Identifies and cleans up zombie Packer resources.
        Stateless execution - performs fresh scan each run.
      CodeUri: .
      Handler: reaper.handler.lambda_handler
      Role: !Ref LambdaRoleArn
      ReservedConcurrentExecutions: 1
      Environment:
        Variables:
          MAX_INSTANCE_AGE_HOURS: !Ref MaxInstanceAgeHours
          DRY_RUN: !Ref DryRun
          SNS_TOPIC_ARN: !Ref NotificationTopic
          LOG_LEVEL: !Ref LogLevel
          BATCH_DELETE_SIZE: !Ref BatchDeleteSize
          KEY_PAIR_PATTERN: !Ref KeyPairPattern
      Events:
        ScheduledEvent:
          Type: Schedule
          Properties:
            Schedule: !Ref ScheduleExpression
            Description: Scheduled trigger for Packer Resource Reaper
            Enabled: true
            Name: !Sub '${AWS::StackName}-schedule'
      Tags:
        Application: PackerResourceReaper
        ManagedBy: SAM

  # CloudWatch Log Group with configurable retention
  ReaperLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-function'
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: Application
          Value: PackerResourceReaper

  # CloudWatch Alarm for Lambda errors
  ErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-errors'
      AlarmDescription: Alarm when Packer Resource Reaper encounters errors
      MetricName: Errors
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref ReaperFunction
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref NotificationTopic
      OKActions:
        - !Ref NotificationTopic

  # CloudWatch Alarm for Lambda throttling
  ThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-throttles'
      AlarmDescription: Alarm when Packer Resource Reaper is throttled
      MetricName: Throttles
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref ReaperFunction
      TreatMissingData: notBreaching

Outputs:
  ReaperFunctionArn:
    Description: ARN of the Packer Resource Reaper Lambda function
    Value: !GetAtt ReaperFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-FunctionArn'

  ReaperFunctionName:
    Description: Name of the Packer Resource Reaper Lambda function
    Value: !Ref ReaperFunction

  NotificationTopicArn:
    Description: ARN of the SNS notification topic
    Value: !Ref NotificationTopic
    Export:
      Name: !Sub '${AWS::StackName}-TopicArn'

  LogGroupName:
    Description: Name of the CloudWatch Log Group
    Value: !Ref ReaperLogGroup

  ScheduleExpression:
    Description: The configured schedule expression
    Value: !Ref ScheduleExpression

  DryRunMode:
    Description: Whether dry-run mode is enabled
    Value: !Ref DryRun
