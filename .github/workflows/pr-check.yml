name: PR Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Override python version
        run: echo "${{ matrix.python-version }}" > .python-version

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint (includes bandit security rules)
        run: uv run ruff check .

      - name: Security audit (all S rules, zero tolerance)
        run: uv run ruff check . --select S --per-file-ignores "tests/*:S101"

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy reaper

      - name: Run tests
        run: uv run pytest tests/ -v --cov=reaper --cov-report=term-missing --cov-fail-under=80

      - name: Dependency audit
        run: uvx pip-audit --progress-spinner=off

  sam-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup AWS SAM CLI
        uses: aws-actions/setup-sam@v3
        with:
          use-installer: true

      - name: Validate SAM template
        run: sam validate --lint

  # Summary job for branch protection (required status check)
  check:
    runs-on: ubuntu-latest
    needs: [check-matrix, sam-validate]
    if: always()
    steps:
      - name: All checks passed
        run: |
          if [ "${{ needs.check-matrix.result }}" != "success" ] || [ "${{ needs.sam-validate.result }}" != "success" ]; then
            echo "One or more checks failed"
            exit 1
          fi
          echo "All checks passed"
